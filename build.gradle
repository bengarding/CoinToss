// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext {
        kotlin_version = '2.2.21'
        agp_version = '8.6.1'

        material_3_version = '1.2.0'
        material_icons_version = '1.6.3'

        tiles_version = '1.5.0'
        horologist_version = '0.6.2'

        hilt_version = '2.57.2'
        hilt_navigation_version = '1.3.0'

        navigation_version = '2.8.9'
        room_version = '2.8.4'

        compose_version = '1.6.2'
        wear_compose_version = '1.4.1'
        compose_coil_version = '2.5.0'

        billing_version = '7.1.1'
        revenue_cat_version = '8.14.2'
    }

    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.1'
        classpath 'com.google.gms:google-services:4.4.2'
        classpath 'com.google.firebase:firebase-crashlytics-gradle:3.0.3'
        classpath 'com.google.firebase:perf-plugin:1.4.2'

        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files

        classpath "com.google.dagger:hilt-android-gradle-plugin:$hilt_version"
    }
}
